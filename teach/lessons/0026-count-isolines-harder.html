<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>第 26 课 · 反推加难题</title>
  <link rel="stylesheet" href="../assets/lesson.css" />
  <style>
    .viz {
      margin: 1rem 0 0.9rem;
      padding: 0.8rem 0.9rem 0.65rem;
      background: #fff;
      border: 1px solid var(--rule);
    }
    .viz h3 { margin: 0 0 0.45rem; font-size: 0.92rem; }
    .viz svg { width: 100%; height: auto; display: block; }
    .trap {
      font-size: 0.82rem;
      color: var(--warn);
      margin: 0 0 0.5rem;
    }
  </style>
</head>
<body>
  <main class="page">
    <p class="eyebrow">Lesson 0026 · 反推进阶</p>
    <h1>再练：容易数错的图</h1>
    <p class="lede">
      专挖陷阱：斜管拆分、多层尺寸、贴拐点「看起来像多一段」。
      每题先数，再点选。
    </p>

    <figure class="viz">
      <h3>题图 E · 斜管拆成水平+竖直</h3>
      <p class="trap">陷阱：图上有两条正交尺寸，是不是 2 条 isoline？</p>
      <svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" role="img">
        <line x1="80" y1="180" x2="420" y2="80" stroke="#0b1f33" stroke-width="12" stroke-linecap="round"/>
        <line x1="420" y1="180" x2="420" y2="80" stroke="#007a8a" stroke-width="2" stroke-dasharray="5 4"/>
        <line x1="90" y1="210" x2="410" y2="210" stroke="#a33b16" stroke-width="2.5"/>
        <text x="200" y="200" font-family="IBM Plex Mono, monospace" font-size="12" fill="#a33b16">水平分量</text>
        <line x1="460" y1="180" x2="460" y2="80" stroke="#a33b16" stroke-width="2.5"/>
        <text x="470" y="135" font-family="IBM Plex Mono, monospace" font-size="12" fill="#a33b16">竖直分量</text>
      </svg>
    </figure>
    <section class="quiz">
      <div class="q">
        <p><strong>Q1.</strong> 题图 E 的 isoline 条数？</p>
        <button type="button" data-correct="1"
          data-ok="对：仍是 1 条斜 isoline；正交两尺是 dimslope 画法，不是两段 mems。"
          data-bad="">1 条</button>
        <button type="button" data-correct="0"
          data-bad="这是斜管拆分量，不是拐弯切段。" data-bad="">2 条</button>
        <button type="button" data-correct="0"
          data-bad="太多。" data-bad="">3 条</button>
        <p class="feedback"></p>
      </div>
    </section>

    <figure class="viz">
      <h3>题图 F · 真弯 + 看似「小拐」的贴拐点</h3>
      <p class="trap">陷阱：第二个弯几乎没画出长度，还要不要数成新段？</p>
      <svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" role="img">
        <line x1="40" y1="180" x2="240" y2="180" stroke="#0b1f33" stroke-width="10"/>
        <path d="M240 180 Q 290 180 290 130" fill="none" stroke="#007a8a" stroke-width="10"/>
        <line x1="290" y1="130" x2="290" y2="50" stroke="#0b1f33" stroke-width="10"/>
        <!-- tiny direction tweak near top - stick, no new dim direction cluster -->
        <path d="M290 50 Q 295 35 310 30" fill="none" stroke="#007a8a" stroke-width="4" stroke-dasharray="4 3"/>
        <line x1="310" y1="30" x2="500" y2="30" stroke="#0b1f33" stroke-width="8" opacity="0.35"/>
        <text x="320" y="55" font-family="IBM Plex Mono, monospace" font-size="11" fill="#a33b16">贴拐点：方向微调</text>
        <text x="320" y="72" font-family="IBM Plex Mono, monospace" font-size="11" fill="#a33b16">图上往往仍只有竖直尺寸一条</text>
        <circle cx="265" cy="165" r="6" fill="#c9a227"/>
        <line x1="50" y1="150" x2="230" y2="150" stroke="#a33b16" stroke-width="2"/>
        <line x1="330" y1="120" x2="330" y2="60" stroke="#a33b16" stroke-width="2"/>
      </svg>
    </figure>
    <section class="quiz">
      <div class="q">
        <p><strong>Q2.</strong> 若贴拐点未新开段，成品图上通常几条 isoline？</p>
        <button type="button" data-correct="0"
          data-bad="真切开只有一处，贴拐点不加段 → 2。" data-bad="">1 条</button>
        <button type="button" data-correct="1"
          data-ok="对：水平+竖直两段；贴拐点不增加第三段。"
          data-bad="">2 条</button>
        <button type="button" data-correct="0"
          data-bad="贴拐点恰恰是为了不变成 3。" data-bad="">3 条</button>
        <p class="feedback"></p>
      </div>
    </section>

    <figure class="viz">
      <h3>题图 G · 弯头 leg 尺寸</h3>
      <p class="trap">陷阱：多了一条「腿长」尺寸，是不是 +1 条 isoline？</p>
      <svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" role="img">
        <line x1="60" y1="180" x2="260" y2="180" stroke="#0b1f33" stroke-width="10"/>
        <path d="M260 180 Q 310 180 310 130" fill="none" stroke="#007a8a" stroke-width="10"/>
        <line x1="310" y1="130" x2="310" y2="50" stroke="#0b1f33" stroke-width="10"/>
        <line x1="310" y1="90" x2="400" y2="90" stroke="#007a8a" stroke-width="6"/>
        <line x1="70" y1="150" x2="250" y2="150" stroke="#a33b16" stroke-width="2"/>
        <line x1="350" y1="120" x2="350" y2="60" stroke="#a33b16" stroke-width="2"/>
        <line x1="320" y1="90" x2="390" y2="90" stroke="#1f6b4a" stroke-width="2.5"/>
        <text x="330" y="80" font-family="IBM Plex Mono, monospace" font-size="11" fill="#1f6b4a">腿长</text>
      </svg>
    </figure>
    <section class="quiz">
      <div class="q">
        <p><strong>Q3.</strong> 题图 G 的 isoline 条数？（腿归在竖直段上）</p>
        <button type="button" data-correct="0"
          data-bad="腿不是新的主管 isoline。" data-bad="">3 条</button>
        <button type="button" data-correct="1"
          data-ok="对：仍是水平+竖直 2 条；腿尺寸挂在已有竖直段上。"
          data-bad="">2 条</button>
        <button type="button" data-correct="0"
          data-bad="有真弯，不是 1。" data-bad="">1 条</button>
        <p class="feedback"></p>
      </div>
    </section>

    <figure class="viz">
      <h3>题图 H · 综合</h3>
      <svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" role="img">
        <line x1="40" y1="220" x2="200" y2="220" stroke="#0b1f33" stroke-width="10"/>
        <path d="M200 220 Q 250 220 250 170" fill="none" stroke="#007a8a" stroke-width="10"/>
        <line x1="250" y1="170" x2="250" y2="100" stroke="#0b1f33" stroke-width="10"/>
        <path d="M250 100 Q 250 55 310 55" fill="none" stroke="#007a8a" stroke-width="10"/>
        <line x1="310" y1="55" x2="520" y2="55" stroke="#0b1f33" stroke-width="10"/>
        <!-- dims -->
        <line x1="50" y1="190" x2="190" y2="190" stroke="#a33b16" stroke-width="2"/>
        <line x1="290" y1="160" x2="290" y2="110" stroke="#a33b16" stroke-width="2"/>
        <!-- second horizontal with sub dims -->
        <line x1="330" y1="25" x2="500" y2="25" stroke="#a33b16" stroke-width="2.5"/>
        <line x1="330" y1="40" x2="400" y2="40" stroke="#a33b16" stroke-width="1.5"/>
        <line x1="410" y1="40" x2="500" y2="40" stroke="#a33b16" stroke-width="1.5"/>
        <circle cx="380" cy="55" r="4" fill="#1f6b4a"/>
        <text x="40" y="260" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#4a5d6e">两弯；末段有主+子尺寸；还有一个焊缝点</text>
      </svg>
    </figure>
    <section class="quiz">
      <div class="q">
        <p><strong>Q4.</strong> 题图 H 的 isoline 条数？</p>
        <button type="button" data-correct="0"
          data-bad="子尺寸和焊缝都不加段。" data-bad="">4 条</button>
        <button type="button" data-correct="1"
          data-ok="对：水平→竖直→水平，共 3；末段多层仍算 1。"
          data-bad="">3 条</button>
        <button type="button" data-correct="0"
          data-bad="两弯应有三直段。" data-bad="">2 条</button>
        <p class="feedback"></p>
      </div>
    </section>

    <div class="callout">
      <strong>进阶口诀：</strong>
      数「主管方向换了几次」；斜管拆分量、子尺寸、焊缝、腿长 —— 默认<strong>不加</strong> isoline。
    </div>

    <nav class="footer-nav">
      <p>
        <a href="0025-count-isolines-from-drawing.html">← 第 25 课</a>
        · 下一课：<a href="0027-bran-dim-review.html">总复习提纲 →</a>
      </p>
    </nav>
  </main>
  <script src="../assets/quiz.js"></script>
</body>
</html>
