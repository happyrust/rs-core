<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>第 37 课 · 反推 isoline 加难套题</title>
  <link rel="stylesheet" href="../assets/lesson.css" />
  <style>
    .viz {
      margin: 1rem 0 0.9rem;
      padding: 0.8rem 0.9rem 0.65rem;
      background: #fff;
      border: 1px solid var(--rule);
    }
    .viz h3 { margin: 0 0 0.45rem; font-size: 0.92rem; }
    .viz svg { width: 100%; height: auto; display: block; }
    .trap {
      font-size: 0.82rem;
      color: var(--warn, #a33b16);
      margin: 0 0 0.5rem;
    }
  </style>
</head>
<body>
  <main class="page">
    <p class="eyebrow">Lesson 0037 · 反推套题 II</p>
    <h1>再挖陷阱：车道 · 支架 · 标签 · 桥接</h1>
    <p class="lede">
      课 26 之后新陷阱：双层 dimtimes、支架挂接、弯头标签、真桥接。
      口诀不变：<strong>只数换向直段</strong>，装饰与材料不加段。
    </p>

    <figure class="viz">
      <h3>题图 G · 内外两层尺寸</h3>
      <p class="trap">陷阱：两条尺寸线，是不是 2 条 isoline？</p>
      <svg viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg" role="img">
        <line x1="60" y1="120" x2="520" y2="120" stroke="#0b1f33" stroke-width="14" stroke-linecap="round"/>
        <line x1="100" y1="95" x2="280" y2="95" stroke="#007a8a" stroke-width="2"/>
        <text x="140" y="85" font-family="IBM Plex Mono, monospace" font-size="12" fill="#007a8a">ATTA 子尺寸</text>
        <line x1="80" y1="60" x2="480" y2="60" stroke="#a33b16" stroke-width="2.5"/>
        <text x="200" y="50" font-family="IBM Plex Mono, monospace" font-size="12" fill="#a33b16">主尺寸（外层）</text>
        <polygon points="500,120 530,112 530,128" fill="#1f6b4a"/>
        <text x="540" y="125" font-family="IBM Plex Mono, monospace" font-size="11" fill="#1f6b4a">流向在外</text>
      </svg>
    </figure>
    <section class="quiz">
      <div class="q">
        <p><strong>Q1.</strong> 题图 G 的 isoline 条数？</p>
        <button type="button" data-correct="1"
          data-ok="对：1 条；dimtimes 两车道 ≠ 两段。"
          data-bad="">1 条</button>
        <button type="button" data-correct="0"
          data-bad="车道不是切段。" data-bad="">2 条</button>
        <button type="button" data-correct="0"
          data-bad="太多。" data-bad="">3 条</button>
        <p class="feedback"></p>
      </div>
    </section>

    <figure class="viz">
      <h3>题图 H · 直管 + 支架</h3>
      <p class="trap">陷阱：中间多了个架子，是不是 +1 段？</p>
      <svg viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg" role="img">
        <line x1="50" y1="80" x2="520" y2="80" stroke="#0b1f33" stroke-width="14" stroke-linecap="round"/>
        <line x1="70" y1="45" x2="480" y2="45" stroke="#a33b16" stroke-width="2.5"/>
        <rect x="260" y="80" width="14" height="70" fill="#a33b16"/>
        <rect x="220" y="150" width="94" height="12" fill="#4a5d6e"/>
        <text x="267" y="185" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="#a33b16">支架</text>
      </svg>
    </figure>
    <section class="quiz">
      <div class="q">
        <p><strong>Q2.</strong> 题图 H 管子 isoline？</p>
        <button type="button" data-correct="1"
          data-ok="对：支架不进管 isoline 计数。"
          data-bad="">1 条</button>
        <button type="button" data-correct="0"
          data-bad="架是 marksupport。" data-bad="">2 条</button>
        <button type="button" data-correct="0"
          data-bad="不是。" data-bad="">0 条</button>
        <p class="feedback"></p>
      </div>
    </section>

    <figure class="viz">
      <h3>题图 I · 弯头旁标签 + 真拐弯</h3>
      <p class="trap">陷阱：弯头旁有文字框，会不会变成 3 段？</p>
      <svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" role="img">
        <line x1="40" y1="160" x2="260" y2="160" stroke="#0b1f33" stroke-width="12"/>
        <path d="M260 160 Q 320 160 320 100" fill="none" stroke="#007a8a" stroke-width="12"/>
        <line x1="320" y1="100" x2="320" y2="30" stroke="#0b1f33" stroke-width="12"/>
        <line x1="60" y1="125" x2="240" y2="125" stroke="#a33b16" stroke-width="2"/>
        <line x1="360" y1="95" x2="360" y2="40" stroke="#a33b16" stroke-width="2"/>
        <circle cx="260" cy="160" r="6" fill="#1f6b4a"/>
        <text x="260" y="190" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="#1f6b4a">E</text>
        <rect x="200" y="175" width="110" height="28" rx="2" fill="#d4eef1" stroke="#007a8a"/>
        <text x="215" y="194" font-family="IBM Plex Mono, monospace" font-size="11" fill="#007a8a">90° / R=1.5D</text>
      </svg>
    </figure>
    <section class="quiz">
      <div class="q">
        <p><strong>Q3.</strong> 题图 I 的 isoline？</p>
        <button type="button" data-correct="1"
          data-ok="对：真切 2 段；标签不加段。"
          data-bad="">2 条</button>
        <button type="button" data-correct="0"
          data-bad="标签不是第三段。" data-bad="">3 条</button>
        <button type="button" data-correct="0"
          data-bad="有公共端 E，是真切。" data-bad="">1 条</button>
        <p class="feedback"></p>
      </div>
    </section>

    <figure class="viz">
      <h3>题图 J · 贴拐点「像拐弯」</h3>
      <p class="trap">陷阱：管子方向变了，但尺寸仍一条贯通？</p>
      <svg viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg" role="img">
        <line x1="40" y1="140" x2="300" y2="140" stroke="#0b1f33" stroke-width="12"/>
        <path d="M300 140 Q 330 140 330 110" fill="none" stroke="#007a8a" stroke-width="12"/>
        <line x1="330" y1="110" x2="330" y2="40" stroke="#0b1f33" stroke-width="12"/>
        <line x1="50" y1="105" x2="290" y2="105" stroke="#a33b16" stroke-width="2.5"/>
        <text x="140" y="95" font-family="IBM Plex Mono, monospace" font-size="12" fill="#a33b16">仍一条主尺寸轨道</text>
        <text x="400" y="100" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#a33b16">无第二段尺寸线</text>
        <text x="400" y="125" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#4a5d6e">→ 贴拐点嫌疑大</text>
      </svg>
    </figure>
    <section class="quiz">
      <div class="q">
        <p><strong>Q4.</strong> 题图 J 更像？</p>
        <button type="button" data-correct="1"
          data-ok="对：贴拐点，isoline 仍 1。"
          data-bad="">1 条（贴拐点）</button>
        <button type="button" data-correct="0"
          data-bad="缺第二段尺寸与共享 E 观感。" data-bad="">2 条（真桥接）</button>
        <button type="button" data-correct="0"
          data-bad="不是。" data-bad="">3 条</button>
        <p class="feedback"></p>
      </div>
    </section>

    <div class="ask-teacher">
      下一课：P1 开码前检查单。
    </div>

      <p>

        · <a href="0026-count-isolines-harder.html">课 26</a>

      </p>
    </nav>
  </main>
  <script src="../assets/quiz.js"></script>
</body>
</html>
