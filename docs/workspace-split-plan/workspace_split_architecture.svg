<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .title { fill: #111827; font-size: 20px; font-weight: 700; }
    .label { fill: #111827; font-size: 14px; font-weight: 600; }
    .sub { fill: #6b7280; font-size: 12px; }
    .lane { fill-opacity: 0.06; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .box { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; }
    .blue { fill: #eff6ff; stroke: #bfdbfe; }
    .green { fill: #f0fdf4; stroke: #bbf7d0; }
    .orange { fill: #fff7ed; stroke: #fed7aa; }
    .purple { fill: #faf5ff; stroke: #e9d5ff; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
  </defs>

  <rect width="960" height="620" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" class="title">rs-core Workspace Split Plan</text>
  <text x="480" y="58" text-anchor="middle" class="sub">Split MBD first, keep aios_core::mbd compatibility, then expand workspace</text>

  <rect x="48" y="92" width="864" height="130" rx="10" class="lane blue"/>
  <text x="68" y="116" class="sub" font-weight="700">WORKSPACE ROOT</text>
  <rect x="92" y="138" width="176" height="56" rx="8" class="box blue"/>
  <text x="180" y="160" text-anchor="middle" class="label">Cargo.toml</text>
  <text x="180" y="180" text-anchor="middle" class="sub">members = crates/*</text>
  <rect x="392" y="138" width="176" height="56" rx="8" class="box blue"/>
  <text x="480" y="160" text-anchor="middle" class="label">aios_core</text>
  <text x="480" y="180" text-anchor="middle" class="sub">root crate / legacy API</text>
  <rect x="692" y="138" width="176" height="56" rx="8" class="box blue"/>
  <text x="780" y="160" text-anchor="middle" class="label">crates/</text>
  <text x="780" y="180" text-anchor="middle" class="sub">child crate set</text>

  <rect x="48" y="258" width="864" height="152" rx="10" class="lane green"/>
  <text x="68" y="282" class="sub" font-weight="700">FIRST SPLIT</text>
  <rect x="110" y="312" width="188" height="64" rx="8" class="box green"/>
  <text x="204" y="336" text-anchor="middle" class="label">src/lib.rs</text>
  <text x="204" y="356" text-anchor="middle" class="sub">pub use aios_mbd as mbd</text>
  <rect x="386" y="304" width="188" height="80" rx="8" class="box green"/>
  <text x="480" y="328" text-anchor="middle" class="label">crates/aios-mbd</text>
  <text x="480" y="348" text-anchor="middle" class="sub">iso_branch / iso_dim</text>
  <text x="480" y="366" text-anchor="middle" class="sub">iso_extras / iso_params</text>
  <rect x="662" y="312" width="188" height="64" rx="8" class="box green"/>
  <text x="756" y="336" text-anchor="middle" class="label">tests/mbd_reexport</text>
  <text x="756" y="356" text-anchor="middle" class="sub">|???R</text>

  <rect x="48" y="446" width="864" height="96" rx="10" class="lane orange"/>
  <text x="68" y="470" class="sub" font-weight="700">VALIDATION</text>
  <rect x="104" y="488" width="202" height="34" rx="8" class="box orange"/>
  <text x="205" y="510" text-anchor="middle" class="sub">cargo check --workspace</text>
  <rect x="378" y="488" width="202" height="34" rx="8" class="box orange"/>
  <text x="479" y="510" text-anchor="middle" class="sub">cargo test -p aios-mbd</text>
  <rect x="652" y="488" width="214" height="34" rx="8" class="box orange"/>
  <text x="759" y="510" text-anchor="middle" class="sub">cargo test --test mbd_reexport</text>

  <path d="M268 166 L392 166" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <path d="M568 166 L692 166" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <path d="M480 194 L480 304" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <path d="M298 344 L386 344" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <path d="M574 344 L662 344" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <path d="M480 384 L480 488" fill="none" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrow-orange)"/>

  <rect x="328" y="154" width="72" height="22" rx="4" fill="#ffffff" opacity="0.95"/>
  <text x="364" y="170" text-anchor="middle" class="sub">workspace</text>
  <rect x="590" y="154" width="78" height="22" rx="4" fill="#ffffff" opacity="0.95"/>
  <text x="629" y="170" text-anchor="middle" class="sub">members</text>
  <rect x="486" y="232" width="92" height="22" rx="4" fill="#ffffff" opacity="0.95"/>
  <text x="532" y="248" text-anchor="middle" class="sub">path dependency</text>
  <rect x="300" y="326" width="74" height="22" rx="4" fill="#ffffff" opacity="0.95"/>
  <text x="337" y="342" text-anchor="middle" class="sub">re-export</text>
  <rect x="584" y="326" width="58" height="22" rx="4" fill="#ffffff" opacity="0.95"/>
  <text x="613" y="342" text-anchor="middle" class="sub">guard</text>

  <g transform="translate(56,570)">
    <line x1="0" y1="8" x2="30" y2="8" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
    <text x="38" y="12" class="sub">Cargo workspace</text>
    <line x1="190" y1="8" x2="220" y2="8" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
    <text x="228" y="12" class="sub">dependency and re-export</text>
    <line x1="388" y1="8" x2="418" y2="8" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
    <text x="426" y="12" class="sub">validation commands</text>
  </g>
</svg>
